[project]
name = "guideme"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.26",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "numba>=0.60",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
clip = [
  "torch>=2.6",
  "open-clip-torch>=2.32",
]

[tool.uv]
package = false
